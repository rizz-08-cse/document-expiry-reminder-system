services:
  - type: web
    name: document-expiry-reminder-api
    env: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: CRON_SCHEDULE
        value: "0 9 * * *"
      - key: SMS_SIMULATION_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
